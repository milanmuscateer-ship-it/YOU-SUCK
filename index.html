<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>you suck</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #000000;
        font-family: Arial, Helvetica, sans-serif;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 14vw, 14rem);
        line-height: 0.9;
        font-weight: 700;
        letter-spacing: -0.08em;
      }

      p {
        margin: 0.75rem 0 0;
        font-size: clamp(1rem, 2vw, 1.5rem);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>you suck</h1>
      <p>By MilesGoneForTheMilk</p>
    </div>
  </body>
</html>
